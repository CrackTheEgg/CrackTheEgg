<body>

  <!-- Fixed Background Image -->

  <!-- Overlay that fades in on scroll -->

  <!-- Hero Section -->
  <div class="hero-container">

      <h1 class="main-heading">Contact.</h1>
      <p class="strapline">create • construct • architect</p>

<!-- ✅ Add this spacer -->
<div class="section-spacer"></div>

  <!-- 🔹 Contact Container -->
    <div class="contact-container">
      <h1 class="contact-heading">Let's Connect</h1>
      <p class="contact-subtitle">You can contact me through any of the methods listed below.</p>

     <div class="contact-methods">
      <p><strong>Email:</strong> <a href="mailto:christianhegarty@hotmail.com">christianhegarty@hotmail.com</a></p>
      <p><strong>Phone:</strong> <a href="tel:+447548058723">07548 058 723</a></p>
     </div>
    </div>

  <!-- Background Fade Script -->
  <script>
    const overlay = document.getElementById('bgOverlay');
    window.addEventListener('scroll', () => {
      const scrollY = window.scrollY;
      const maxFadeStart = 1300;
      let opacity = Math.min(scrollY / maxFadeStart, 1);
      overlay.style.backgroundColor = `rgba(0, 0, 31, ${opacity * 0.7})`;
      overlay.style.transition = 'background-color 0.2s ease-out';
    });
  </script>

</body>
